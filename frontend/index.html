<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="icon" type="image/png" href="/Logo-Icon-Green.png" />
    <link rel="apple-touch-icon" href="/Logo-Icon-Green.png" />
    <title>ServiceHub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
    <!-- EBANQO Widget for customer support chat -->
    <script>
      // Only load widget on public pages, not on dashboards or admin
      const restrictedPaths = ['/admin', '/homeowner-dashboard', '/tradesperson-dashboard', '/dashboard', '/trades', '/profile', '/my-jobs', '/my-interests', '/wallet', '/messages', '/my-profile'];
      const isRestricted = restrictedPaths.some(path => window.location.pathname.includes(path));
      
      if (!isRestricted) {
        (function (w, d, s, o, f, js, fjs) {
          w['EBANQO-WIDGET'] = o;
          w[o] =
            w[o] ||
            function () {
              (w[o].q = w[o].q || []).push(arguments);
            };
          (js = d.createElement(s)), (fjs = d.getElementsByTagName(s)[0]);
          js.id = o;
          js.src = f;
          js.async = 1;
          fjs.parentNode.insertBefore(js, fjs);
        })(window, document, 'script', 'ebanqo_widget', 'https://widget.ebanqo.io/app.js');
        ebanqo_widget('init', { url: 'https://webchat.ebanqo.io/v2/servicehubltd' });
      }
    </script>
  </body>
</html>
