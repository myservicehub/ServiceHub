name: Deploy to DigitalOcean App Platform

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-do-app
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.DO_TOKEN }}" ]; then
            echo "ERROR: DO_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DO_APP_ID }}" ]; then
            echo "ERROR: DO_APP_ID secret is not set"
            exit 1
          fi
          echo "Secrets verified successfully"

      - name: List DigitalOcean apps
        run: doctl apps list

      - name: Deploy to DigitalOcean App Platform
        run: |
          echo "Triggering deployment for app: ${{ secrets.DO_APP_ID }}"
          doctl apps create-deployment ${{ secrets.DO_APP_ID }} || {
            echo "Deployment trigger failed - but note: DigitalOcean may auto-deploy from git push"
            exit 0
          }
          
      - name: Wait for deployment
        run: |
          echo "Deployment triggered. Checking status..."
          for i in {1..30}; do
            STATUS=$(doctl apps get ${{ secrets.DO_APP_ID }} --format last_deployment_status --no-header)
            echo "Deployment status: $STATUS"
            if [[ "$STATUS" == "SUCCESS" ]] || [[ "$STATUS" == "ACTIVE" ]]; then
              echo "Deployment successful!"
              exit 0
            fi
            sleep 10
          done
          echo "Deployment check complete"
